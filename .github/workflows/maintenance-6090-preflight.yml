name: MoE override merge preflight (fork only)
on:
  push:
    branches: [codex/megatron-6090-preflight]
permissions:
  contents: read
jobs:
  targeted-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: d61867f559014a26b987d92a7e5b48af6c8fe78b
          submodules: recursive
          persist-credentials: false
      - name: Verify source and runner resources
        env:
          EXPECTED_SHA: d61867f559014a26b987d92a7e5b48af6c8fe78b
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git submodule status
          nproc
          free -h
          df -h /
      - name: Prepare disk for the public CUDA development container
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - name: Pull the exact current CI base (CPU host)
        run: docker pull nvcr.io/nvidia/pytorch@sha256:f71fd67f6d71f685e0bd08ce6c8df48807624cc5d48886370d3471bc4f89d81d
      - name: Start isolated dependency and test container
        run: |
          docker run -d --name merge-preflight --shm-size=1g \
            -v "$GITHUB_WORKSPACE:/opt/Megatron-Bridge" -w /opt/Megatron-Bridge \
            nvcr.io/nvidia/pytorch@sha256:f71fd67f6d71f685e0bd08ce6c8df48807624cc5d48886370d3471bc4f89d81d sleep infinity
          docker exec merge-preflight bash -lc 'curl -LsSf https://astral.sh/uv/0.7.2/install.sh | sh && install -m 0755 /root/.local/bin/uv /usr/local/bin/uv && uv venv /opt/venv --system-site-packages'
      - name: Full repository pre-commit checks
        run: |
          docker exec merge-preflight bash -lc 'uv run --no-project --with pre-commit==3.6.0 pre-commit run --all-files'
          git diff --exit-code
      - name: Install locked test environment using documented CUDA build settings
        run: |
          docker exec -e UV_PROJECT_ENVIRONMENT=/opt/venv -e UV_CONCURRENT_BUILDS=2 \
            -e MAX_JOBS=2 -e NVTE_BUILD_MAX_JOBS=2 -e NVTE_BUILD_THREADS_PER_JOB=1 \
            -e FLASH_MLA_DISABLE_SM90=1 -e NVCC_THREADS=1 \
            -e 'CFLAGS=-I/usr/local/cuda/include/cccl -DNDEBUG' \
            -e 'CXXFLAGS=-I/usr/local/cuda/include/cccl -DNDEBUG' merge-preflight \
            bash -lc 'export TMS_CUDA_MAJOR="$(/usr/local/cuda/bin/nvcc --version | sed -n "s/.*release \([0-9][0-9]*\).*/\1/p" | head -1)"; test -n "$TMS_CUDA_MAJOR"; uv sync --locked --group test --group dev'
      - name: Run actual focused configuration tests (no GPU)
        run: |
          docker exec -e UV_PROJECT_ENVIRONMENT=/opt/venv merge-preflight \
            bash -lc 'uv run --no-sync python -m pytest tests/unit_tests/scripts/performance/test_user_overrides.py -q'
      - name: Required strict type check on changed source
        run: |
          docker exec -e UV_PROJECT_ENVIRONMENT=/opt/venv merge-preflight \
            bash -lc 'uv run --no-sync mypy --strict scripts/performance/utils/overrides.py tests/unit_tests/scripts/performance/test_user_overrides.py'
      - name: Ensure checks left source unchanged
        if: always()
        run: git diff --exit-code
      - name: Stop this job's container
        if: always()
        run: docker stop merge-preflight
