name: MoE Hopper CPU validation retry (fork only)
on:
  push:
    branches: [codex/megatron-6090-pass2-preflight]
permissions:
  contents: read
jobs:
  targeted-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: 817aa59d0d270129a24988f3bd1d225ab4bb41f5
      BASELINE_SHA: f224fe5bf5f812afa69987c22ea1a17e12fa2e6c
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 817aa59d0d270129a24988f3bd1d225ab4bb41f5
          fetch-depth: 2
          submodules: recursive
          persist-credentials: false
      - name: Verify exact candidate, baseline, locked sources and resources
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^2)" = "$BASELINE_SHA"
          git diff --exit-code "$BASELINE_SHA" -- uv.lock pyproject.toml docker/Dockerfile.ci
          git submodule status
          git worktree add --detach "$RUNNER_TEMP/megatron-baseline" "$BASELINE_SHA"
          nproc
          free -h
          df -h /
          mkdir -p "$RUNNER_TEMP/preflight-evidence"
      - name: Prepare owned hosted runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - name: Pull unchanged immutable PyTorch 26.09 CI base
        run: docker pull nvcr.io/nvidia/pytorch@sha256:f71fd67f6d71f685e0bd08ce6c8df48807624cc5d48886370d3471bc4f89d81d
      - name: Start isolated validation container
        run: |
          docker run -d --name merge-preflight --shm-size=1g \
            -v "$GITHUB_WORKSPACE:/opt/Megatron-Bridge" \
            -v "$RUNNER_TEMP/megatron-baseline:/opt/baseline" \
            -v "$RUNNER_TEMP/preflight-evidence:/opt/evidence" \
            -w /opt/Megatron-Bridge \
            nvcr.io/nvidia/pytorch@sha256:f71fd67f6d71f685e0bd08ce6c8df48807624cc5d48886370d3471bc4f89d81d sleep infinity
          docker exec merge-preflight bash -lc 'curl -LsSf https://astral.sh/uv/0.7.2/install.sh | sh && install -m 0755 /root/.local/bin/uv /usr/local/bin/uv && uv venv /opt/venv --system-site-packages'
          docker exec merge-preflight git config --global --add safe.directory /opt/Megatron-Bridge
      - name: Full repository pre-commit checks
        run: |
          set -o pipefail
          docker exec merge-preflight bash -lc 'uv run --no-project --with pre-commit==3.6.0 pre-commit run --all-files' 2>&1 | tee "$RUNNER_TEMP/preflight-evidence/precommit.log"
          git diff --exit-code
      - name: Install exact locked sources for Hopper with bounded native concurrency
        id: native
        run: |
          set -o pipefail
          (
            while sleep 60; do
              date -u
              docker stats --no-stream merge-preflight
              docker exec merge-preflight bash -lc 'cat /sys/fs/cgroup/memory.events; free -m; if test -f /opt/te-44f31bbe-h100-build/.ninja_log; then wc -l /opt/te-44f31bbe-h100-build/.ninja_log; tail -3 /opt/te-44f31bbe-h100-build/.ninja_log; fi; ps -eo pid,rss,etime,args --sort=-rss | head -8'
            done
          ) > "$RUNNER_TEMP/preflight-evidence/native-progress.log" 2>&1 &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          # shellcheck disable=SC2016 # The inner Bash expands CUDA variables inside the container.
          timeout 50m docker exec -e UV_PROJECT_ENVIRONMENT=/opt/venv -e UV_CONCURRENT_BUILDS=1 \
            -e MAX_JOBS=1 -e NVTE_BUILD_MAX_JOBS=1 -e NVTE_BUILD_THREADS_PER_JOB=1 \
            -e NVTE_CUDA_ARCHS=90 -e NVTE_CMAKE_BUILD_DIR=/opt/te-44f31bbe-h100-build \
            -e FLASH_MLA_DISABLE_SM90=1 -e NVCC_THREADS=1 \
            -e 'CFLAGS=-I/usr/local/cuda/include/cccl -DNDEBUG' \
            -e 'CXXFLAGS=-I/usr/local/cuda/include/cccl -DNDEBUG' merge-preflight \
            bash -lc 'export TMS_CUDA_MAJOR="$(/usr/local/cuda/bin/nvcc --version | sed -n "s/.*release \([0-9][0-9]*\).*/\1/p" | head -1)"; test -n "$TMS_CUDA_MAJOR"; uv sync --locked --group test --group dev -v' \
            2>&1 | tee "$RUNNER_TEMP/preflight-evidence/native-sync.log"
      - name: Actual focused candidate configuration tests
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: |
          set -o pipefail
          docker exec -e UV_PROJECT_ENVIRONMENT=/opt/venv -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 merge-preflight \
            bash -lc 'uv run --no-sync python -m pytest tests/unit_tests/scripts/performance/test_user_overrides.py -q --junitxml=/opt/evidence/candidate.xml' \
            2>&1 | tee "$RUNNER_TEMP/preflight-evidence/candidate-tests.log"
      - name: Actual strict candidate type check
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: |
          set -o pipefail
          docker exec -e UV_PROJECT_ENVIRONMENT=/opt/venv merge-preflight \
            bash -lc 'uv run --no-sync mypy --strict scripts/performance/utils/overrides.py tests/unit_tests/scripts/performance/test_user_overrides.py' \
            2>&1 | tee "$RUNNER_TEMP/preflight-evidence/candidate-mypy.log"
      - name: Untouched baseline configuration tests in same native environment
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: |
          set -o pipefail
          docker exec -w /opt/baseline -e UV_PROJECT_ENVIRONMENT=/opt/venv \
            -e PYTHONPATH=/opt/baseline/src:/opt/Megatron-Bridge/3rdparty/Megatron-LM \
            -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 merge-preflight \
            bash -lc 'uv run --no-sync python -m pytest tests/unit_tests/scripts/performance/test_user_overrides.py -q --junitxml=/opt/evidence/baseline.xml' \
            2>&1 | tee "$RUNNER_TEMP/preflight-evidence/baseline-tests.log"
          git -C "$RUNNER_TEMP/megatron-baseline" diff --exit-code
      - name: Actual strict baseline type check in same native environment
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: |
          set -o pipefail
          docker exec -w /opt/baseline -e UV_PROJECT_ENVIRONMENT=/opt/venv \
            -e PYTHONPATH=/opt/baseline/src:/opt/Megatron-Bridge/3rdparty/Megatron-LM merge-preflight \
            bash -lc 'uv run --no-sync mypy --strict scripts/performance/utils/overrides.py tests/unit_tests/scripts/performance/test_user_overrides.py' \
            2>&1 | tee "$RUNNER_TEMP/preflight-evidence/baseline-mypy.log"
      - name: Verify regression fails on unchanged baseline production code
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: |
          set -o pipefail
          baseline="$RUNNER_TEMP/megatron-baseline"
          trap 'git -C "$baseline" restore tests/unit_tests/scripts/performance/test_user_overrides.py' EXIT
          cp tests/unit_tests/scripts/performance/test_user_overrides.py "$baseline/tests/unit_tests/scripts/performance/test_user_overrides.py"
          status=0
          docker exec -w /opt/baseline -e UV_PROJECT_ENVIRONMENT=/opt/venv \
            -e PYTHONPATH=/opt/baseline/src:/opt/Megatron-Bridge/3rdparty/Megatron-LM \
            -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 merge-preflight \
            bash -lc 'uv run --no-sync python -m pytest tests/unit_tests/scripts/performance/test_user_overrides.py -q --junitxml=/opt/evidence/baseline-regression.xml' \
            2>&1 | tee "$RUNNER_TEMP/preflight-evidence/baseline-regression.log" || status=$?
          test "$status" = 1
          python - <<'CHECK'
          import os
          import pathlib
          import xml.etree.ElementTree as ET
          root = ET.parse(pathlib.Path(os.environ["RUNNER_TEMP"]) / "preflight-evidence/baseline-regression.xml")
          failures = [(t.attrib["name"], t.find("failure")) for t in root.findall(".//testcase") if t.find("failure") is not None]
          assert len(failures) == 1, failures
          name, failure = failures[0]
          assert name == "test_moe_a2a_overlap_false_disables_overlap", name
          assert "assert True is False" in failure.attrib["message"], failure.attrib
          assert not root.findall(".//error")
          CHECK
      - name: Verify exact source state after checks
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff --exit-code
          git -C "$RUNNER_TEMP/megatron-baseline" diff --exit-code
      - name: Collect native diagnostic state
        if: always()
        run: |
          docker exec merge-preflight bash -lc 'cat /sys/fs/cgroup/memory.events; free -m; if test -f /opt/te-44f31bbe-h100-build/.ninja_log; then cat /opt/te-44f31bbe-h100-build/.ninja_log; fi' > "$RUNNER_TEMP/preflight-evidence/final-native-state.log" 2>&1 || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: megatron6090-pass2-native-validation
          path: ${{ runner.temp }}/preflight-evidence
          retention-days: 7
      - name: Stop only this job's owned container
        if: always()
        run: docker stop merge-preflight
