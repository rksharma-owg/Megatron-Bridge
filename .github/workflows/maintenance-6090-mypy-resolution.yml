name: First-party mypy source resolution diagnostic (fork only)
on:
  push:
    branches: [codex/megatron-6090-mypy-resolution]
permissions:
  contents: read
jobs:
  strict-tools-only-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        source:
          - 1d495500a3cff5f9e05cc3e7c27b7fda4ee1a101
          - b53e66c47b9704dd16ce399865bea4f4f004e53b
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify immutable source and install checker tool only
        env:
          EXPECTED_SHA: ${{ matrix.source }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD
          curl -LsSf https://astral.sh/uv/0.7.2/install.sh | sh
          "$HOME/.local/bin/uv" tool install mypy==2.4.0
          "$HOME/.local/bin/mypy" --version
          echo 'Diagnostic tools-only environment: native dependencies and runtime behavior are not validated.'
      - name: Execute bounded strict checker with first-party source root
        env:
          MYPYPATH: ${{ github.workspace }}/src
        run: |
          set -o pipefail
          timeout 180s "$HOME/.local/bin/mypy" --strict --verbose --cache-dir "$RUNNER_TEMP/mypy-cache" \
            scripts/performance/utils/overrides.py tests/unit_tests/scripts/performance/test_user_overrides.py \
            2>&1 | tee strict-tools-only.log
      - name: Verify checker resolved the real first-party CommOverlapConfig source
        if: ${{ !cancelled() }}
        run: |
          grep -E 'LOG:.*(Parsing|Metadata fresh).*src/megatron/bridge/training/comm_overlap.py' strict-tools-only.log
          if grep -E 'test_user_overrides.py:.*Skipping analyzing "megatron.bridge.training.comm_overlap"' strict-tools-only.log; then
            echo 'First-party module still treated as untyped installed package.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v7
        if: always()
        with:
          name: strict-tools-only-${{ matrix.source }}
          path: strict-tools-only.log
